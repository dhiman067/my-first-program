<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>

<body>
    <header>
        <h1 style="text-align: center;">Event Registration form</h1>
        <p>Please fill out the form below to register for the event.</p>
        <hr>
    </header>
    <section>
        <ul>
        <li>Event Name:Digital Masterclass</li>
        <li>Event Date:November 15, 2023</li>
        <li>Event Location:Convention Center</li>
    </ul>
    </section>
    <h1>Participant Information</h1>
    <form>
        <label for="name">Full Name</label>
        <input type="text">
        <label>Date Of Birth</label>
        <input type="date" placeholder="mm/dd/yyyy">
        <br>
        <div style="margin-top: 10px">
            <label for="Gender">Gender</label>
        <select>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>
        <label for="phone number">Phone Number</label>
        <input type="tel" id="phone number" name="phone number" placeholder="123-456-7890">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="example1234@email.com">
        </div>
        <p>
            Where did you hear about this event?
        </p>
        <strong>
        <section style="line-height: 2;">
            <label for="Social Media">Social Media</label>
        <select name="Social Media">
            <option value="Facebook">Facebook</option>
            <option value="Instagram">Instagram</option>
            <option value="twitter">Twitter</option>
            <option value="advertisement">Advertisement</option>
            <option value="Youtube">Youtube</option>
        </select>
        <br>
        <input type="radio" id="friend" name="referral" value="friend">
        <label for="friend">Friend</label>
        <br>
        <input type="radio" id="advertisement" name="referral" value="advertisement">
        <label for="advertisement">Advertisement</label>
        <br>
        <input type="radio" id="other" name="referral" value="other">
        <label for="other">Other</label>
        <input type="text" id="other" name="other" placeholder="Please specify">

        </section>
        </strong>
        <hr>

        <section>
            <label><strong>Number of tickets:</strong></label>
            <input type="number" min="1" value="1">
            <label style="margin-left: 20px;"><strong>Payment Method:</strong></label>
            <input type="radio" name="payment">
            <label>Credit Card</label>
            <input type="radio" name="payment">
            <label>Debit Card</label>
            <input type="radio" name="payment">
            <label>PayPal</label>
            <input type="radio" name="payment">
            <label>Bikash</label>
        </section>
        <section style="text-align: center; margin-top: 20px;">
            <button><a href="config.html">Proceed to Payment</a></button>
        </section>
